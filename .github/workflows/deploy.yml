name: Deploy

# Build and publish to Cloudflare Pages whenever main advances (i.e. on merge),
# plus a manual "Run workflow" button. Runs entirely on GitHub's runners — no local
# machine or local token involved.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN (Settings → Secrets and
# variables → Actions). Mint it at Cloudflare → My Profile → API Tokens with the
# "Cloudflare Pages: Edit" permission on this account, plus "Workers Scripts: Edit" for the
# sync Worker job below. The runtime analytics secret
# (CF_ANALYTICS_TOKEN) is a Pages project secret and is NOT needed here — deploys keep
# the project's existing secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two independent jobs, so a Worker failure can never fail or block the Pages deploy:
#   deploy         - the Pages site (every push to main).
#   deploy-worker  - the gss-stats-sync Worker (workers/sync/), only when its inputs changed
#                    (see "Detect Worker changes" below) or on a manual run. Its Cloudflare token
#                    needs "Workers Scripts: Edit" as well (see the README's Deploy section).
# Each job has its own concurrency group: no workflow-level group, because that would let a
# newer push cancel the Worker job too.
jobs:
  deploy:
    runs-on: ubuntu-latest
    # One Pages deploy at a time; a newer push supersedes an in-flight run.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # current LTS; wrangler 4.x requires Node >= 22
          cache: npm
      - run: npm ci
      - run: npm test # a red test (e.g. the auth gate) stops the deploy
      - run: npm run typecheck # a type error stops the deploy too
      - run: npm run build
      - name: Publish to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=gss-stats --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a32bba62c77df5e8f6bd33d04478ec34

  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Never cancel a Worker deploy mid-flight; a newer push waits its turn.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changed-files check below diffs against the pre-push commit
      # The Worker bundles workers/sync/ and (transitively) src/lib/, so those and the pinned
      # wrangler (package-lock.json) are its inputs; this workflow file is one too, so editing it
      # also redeploys. A manual run, a new/forced branch or an unknown base always deploys.
      - name: Detect Worker changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Manual run: deploying the Worker."; exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "No usable base commit: deploying the Worker."; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -E '^(workers/sync/|src/lib/|package-lock\.json$|\.github/workflows/deploy\.yml$)' | grep -vE '\.test\.ts$' || true)
          if [ -n "$changed" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Worker inputs changed:"; echo "$changed"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "No Worker inputs changed: skipping the Worker deploy."
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version: 24 # current LTS; wrangler 4.x requires Node >= 22
          cache: npm
      - if: steps.changes.outputs.deploy == 'true'
        run: npm ci
      - if: steps.changes.outputs.deploy == 'true'
        run: npm test # a red test stops the Worker deploy too
      # Same command as the manual deploy: stamps the version (tag, message, GIT_SHA var) with
      # this commit and a hash of the campaign definitions, and attaches the cron in
      # workers/sync/wrangler.toml. Reads the token from CLOUDFLARE_API_TOKEN. The D1 and Secrets
      # Store bindings are declared in wrangler.toml; no secret value is needed here.
      - name: Deploy the sync Worker
        if: steps.changes.outputs.deploy == 'true'
        run: npm run ads:worker-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a32bba62c77df5e8f6bd33d04478ec34
