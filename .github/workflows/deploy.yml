name: Deploy

# Build and publish to Cloudflare Pages whenever main advances (i.e. on merge),
# plus a manual "Run workflow" button. Runs entirely on GitHub's runners — no local
# machine or local token involved.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN (Settings → Secrets and
# variables → Actions). Mint it at Cloudflare → My Profile → API Tokens with the
# "Cloudflare Pages: Edit" permission on this account. The sync Worker job below uses the
# optional secret CLOUDFLARE_WORKERS_API_TOKEN (Workers Scripts: Edit, plus Secrets Store if its
# bindings need it) and falls back to CLOUDFLARE_API_TOKEN. The runtime analytics secret
# (CF_ANALYTICS_TOKEN) is a Pages project secret and is NOT needed here — deploys keep
# the project's existing secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Independent outcomes, so a Worker failure can never fail or block the Pages deploy:
#   deploy         - the Pages site (every push to main). It waits for deploy-live (a Pages service
#                    binding to gss-live needs that Worker to exist first) but runs even when
#                    deploy-live fails or is skipped (see its `if`).
#   deploy-live    - the gss-live Worker (workers/live/, the Durable Object behind live updates),
#                    only when its inputs changed or on a manual run. Same token as deploy-worker.
#   deploy-worker  - the gss-stats-sync Worker (workers/sync/), only when its inputs changed
#                    (see "Detect Worker changes" below) or on a manual run. Its Cloudflare token
#                    uses CLOUDFLARE_WORKERS_API_TOKEN, or CLOUDFLARE_API_TOKEN if that is unset
#                    (scopes: see the README's Deploy section).
# Each job has its own concurrency group: no workflow-level group, because that would let a
# newer push cancel the Worker job too.
jobs:
  deploy:
    # Order Pages after gss-live: Pages binds it as a service binding, and Cloudflare requires the
    # target Worker to be deployed first. `!cancelled()` is a status function, so it replaces the
    # implicit `success()`: Pages still runs when deploy-live failed or was skipped (without it a
    # failed or skipped need skips this job too) and stops only if the whole run is cancelled.
    needs: deploy-live
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # One Pages deploy at a time; a newer push supersedes an in-flight run.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # current LTS; wrangler 4.x requires Node >= 22
          cache: npm
      - run: npm ci
      - run: npm test # a red test (e.g. the auth gate) stops the deploy
      - run: npm run typecheck # a type error stops the deploy too
      - run: npm run build
      - name: Publish to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=gss-stats --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a32bba62c77df5e8f6bd33d04478ec34

  deploy-live:
    if: github.ref == 'refs/heads/main' # a manual run from another branch must not deploy gss-live to production
    runs-on: ubuntu-latest
    # Pages `deploy` waits on this job (needs), so a hung npm ci or wrangler must not hold it for the
    # 360-minute default. A job timeout does not cancel the run, so Pages still runs.
    timeout-minutes: 10
    permissions:
      contents: read
    # Never cancel a Worker deploy mid-flight; a newer push waits its turn.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changed-files check below diffs against the pre-push commit
      # gss-live bundles workers/live/ only; this workflow file is its other input. package-lock.json is
      # NOT a trigger: every release bumps its version fields, and a deploy drops every open socket. After
      # a wrangler bump, use "Run workflow" to redeploy gss-live. A manual run, a new/forced branch or an
      # unknown base deploys, unless the repo variable LIVE_DEPLOY_PAUSED is "true": then nothing deploys,
      # a manual run included. After removing the variable, use "Run workflow" to ship what merged meanwhile.
      - name: Detect gss-live changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PAUSED: ${{ vars.LIVE_DEPLOY_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "gss-live deploy PAUSED (repo variable LIVE_DEPLOY_PAUSED=true): skipping. Remove the variable, then Run workflow to ship what merged meanwhile."; exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Manual run: deploying gss-live."; exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "No usable base commit: deploying gss-live."; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -E '^(workers/live/|\.github/workflows/deploy\.yml$)' | grep -vE '\.(test|spec)\.[cm]?[jt]s$' || true)
          if [ -n "$changed" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "gss-live inputs changed:"; echo "$changed"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "No gss-live inputs changed: skipping the gss-live deploy."
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version: 24 # current LTS; wrangler 4.x requires Node >= 22
          cache: npm
      - if: steps.changes.outputs.deploy == 'true'
        run: npm ci
      - if: steps.changes.outputs.deploy == 'true'
        run: npx vitest run workers/live # a red gss-live unit test stops its deploy too
      # Declares the HUB Durable Object (migration v1) and the Notify entrypoint in
      # workers/live/wrangler.toml; no secret value is needed beyond the API token.
      - name: Deploy gss-live
        id: deploy
        if: steps.changes.outputs.deploy == 'true'
        run: npx wrangler deploy -c workers/live/wrangler.toml
        env:
          # A Worker-capable token can be added without touching the Pages secret.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a32bba62c77df5e8f6bd33d04478ec34
      - name: Explain a failed gss-live deploy
        if: failure() && steps.deploy.conclusion == 'failure'
        run: |
          echo "::error::gss-live deploy failed. If the error above is an authentication or permission one (401/403, 'Authentication error', 'not authorized'), the token lacks Workers Scripts: Edit. This job authenticates with the repo secret CLOUDFLARE_WORKERS_API_TOKEN when set, otherwise CLOUDFLARE_API_TOKEN (the Pages token). Add or fix either secret (README: Deploy). Pages still deploys, but until gss-live exists a Pages deploy that binds it can fail: fix the token, then use Run workflow (a manual run forces this job)."

  deploy-worker:
    if: github.ref == 'refs/heads/main' # a manual run from another branch must not deploy its Worker to production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Never cancel a Worker deploy mid-flight; a newer push waits its turn.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changed-files check below diffs against the pre-push commit
      # The Worker bundles workers/sync/ and (transitively) src/lib/, so those and the pinned
      # wrangler (package-lock.json), the root tsconfig.json and the deploy script (stamping, cron)
      # are its inputs; this workflow file is one too, so editing it also redeploys. A manual run,
      # a new/forced branch or an unknown base always deploys, unless the repo variable
      # WORKER_DEPLOY_PAUSED is "true" (a deliberately held cron: nothing deploys until it is removed).
      - name: Detect Worker changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PAUSED: ${{ vars.WORKER_DEPLOY_PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Worker deploy PAUSED (repo variable WORKER_DEPLOY_PAUSED=true): skipping. Remove the variable to resume."; exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Manual run: deploying the Worker."; exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "No usable base commit: deploying the Worker."; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -E '^(workers/sync/|src/lib/|package-lock\.json$|tsconfig\.json$|scripts/ads-reads/worker-deploy\.ts$|\.github/workflows/deploy\.yml$)' | grep -vE '\.test\.ts$' || true)
          if [ -n "$changed" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Worker inputs changed:"; echo "$changed"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "No Worker inputs changed: skipping the Worker deploy."
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version: 24 # current LTS; wrangler 4.x requires Node >= 22
          cache: npm
      - if: steps.changes.outputs.deploy == 'true'
        run: npm ci
      - if: steps.changes.outputs.deploy == 'true'
        run: npm test # a red test stops the Worker deploy too
      # Same command as the manual deploy: stamps the version (tag, message, GIT_SHA var) with
      # this commit and a hash of the campaign definitions, and attaches the cron in
      # workers/sync/wrangler.toml. Reads the token from CLOUDFLARE_API_TOKEN. The D1 and Secrets
      # Store bindings are declared in wrangler.toml; no secret value is needed here.
      - name: Deploy the sync Worker
        id: deploy
        if: steps.changes.outputs.deploy == 'true'
        run: npm run ads:worker-deploy
        env:
          # A Worker-capable token can be added without touching the Pages secret.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a32bba62c77df5e8f6bd33d04478ec34
      - name: Explain a failed Worker deploy
        if: failure() && steps.deploy.conclusion == 'failure'
        run: |
          echo "::error::Worker deploy failed. If the error above is an authentication or permission one (401/403, 'Authentication error', 'not authorized'), the token lacks Workers Scripts: Edit (or Secrets Store access for the secrets_store bindings). This job authenticates with the repo secret CLOUDFLARE_WORKERS_API_TOKEN when set, otherwise CLOUDFLARE_API_TOKEN (the Pages token). Add or fix either secret (README: Deploy)."
