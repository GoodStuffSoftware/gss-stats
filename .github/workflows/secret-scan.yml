name: Secret scan

# The repo is public, so env data (tokens, keys, emails, IPs, account ids) must never be committed
# (README "Environment data"). This runs gitleaks over the full history of the pushed ref on every
# push (any branch: merges to main come without a pull request) and on every pull request, with the
# repo's rules in .gitleaks.toml. Findings from before this guard are listed by fingerprint in
# .gitleaksignore. The log prints rule, file and commit only (--redact), never a value.
#
# gitleaks is run as the release binary, pinned to a version and its published SHA-256, rather than
# through gitleaks-action (which needs a paid license key for an organization's repos).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history of this ref is scanned
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          f="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/$f"
          echo "$SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan this ref's history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --log-opts="HEAD" --redact --no-banner --exit-code 1 .
