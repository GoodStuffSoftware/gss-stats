name = "gss-stats"
compatibility_date = "2026-06-01"
pages_build_output_dir = "dist"

# Durable dashboard config storage. `id` is filled in after the namespace is
# created with: npx wrangler kv namespace create STATS_CONFIG
# Local `wrangler pages dev` simulates this binding automatically (id ignored).
[[kv_namespaces]]
binding = "STATS_CONFIG"
id = "f1fa625cdb844c109c4db4acc02d00f5"

# Shared geo store written by the public gss-beacon project; read-only here.
[[d1_databases]]
binding = "gss_geo"
database_name = "gss-geo"
database_id = "fa0b2929-0086-479e-ae10-50509c34ebf8"

# gss-stats' OWN ads-read store (docs/adr/0001-ads-read-store.md): Google Ads spend, the
# readings log and threshold state, written by scripts/ads-reads/ and read by /api/metrics (the
# spend and freshness facts) and /api/ads/readings. Schema: migrations/gss-stats-ads/, applied with
#   npx wrangler d1 migrations apply gss-stats-ads --remote
# migrations_dir is scoped to this database only, so `migrations apply gss-geo` finds nothing.
[[d1_databases]]
binding = "gss_stats_ads"
database_name = "gss-stats-ads"
database_id = "785327a3-683c-4f85-819d-abe11efcacc9"
migrations_dir = "migrations/gss-stats-ads"

# The gss-stats-sync Worker (workers/sync/), reachable ONLY through this Service Binding: it has
# no workers.dev URL and no route. /api/ads/refresh asks it to run the shared Ads sync when the
# data is stale (docs/adr/0001-ads-read-store.md, "The sync Worker").
[[services]]
binding = "ADS_SYNC"
service = "gss-stats-sync"

# Secret (NOT here): CF_ANALYTICS_TOKEN — set per-environment via
#   npx wrangler pages secret put CF_ANALYTICS_TOKEN
# and locally via .dev.vars (gitignored).

# ── Preview environment (Pages preview deployments only) ─────────────────────────
# Pages uses [env.preview] for every non-production-branch deploy, e.g.
#   npx wrangler pages deploy dist --project-name gss-stats --branch dev
# which serves at https://dev.gss-stats.pages.dev. There is no [env.production], so
# production keeps using the top-level config above, unchanged. Bindings and vars are
# NOT inherited from the top level, so every binding is repeated here. See README
# "Deploy" → "Preview (dev)" and the 2026-09-30 amendment in docs/adr/0002-google-auth.md.
[env.preview]

# Preview's OWN config store (gss-stats-config-preview), seeded with a copy of the
# production dashboard; preview saves never touch production's STATS_CONFIG.
[[env.preview.kv_namespaces]]
binding = "STATS_CONFIG"
id = "7c960394bc934b07a0564e58525c1f73"

# The same real D1 stores as production: preview reads live geo and ads data.
[[env.preview.d1_databases]]
binding = "gss_geo"
database_name = "gss-geo"
database_id = "fa0b2929-0086-479e-ae10-50509c34ebf8"

[[env.preview.d1_databases]]
binding = "gss_stats_ads"
database_name = "gss-stats-ads"
database_id = "785327a3-683c-4f85-819d-abe11efcacc9"
migrations_dir = "migrations/gss-stats-ads"

# The real sync Worker: an ads refresh on preview runs a real Google Ads sync.
[[env.preview.services]]
binding = "ADS_SYNC"
service = "gss-stats-sync"

# The one extra hostname the host guard (functions/_middleware.ts) serves, and only
# where this var is set: preview deployments. Production never has it.
[env.preview.vars]
PREVIEW_HOST = "dev.gss-stats.pages.dev"
