name = "gss-stats"
compatibility_date = "2026-06-01"
pages_build_output_dir = "dist"

# Durable dashboard config storage. `id` is filled in after the namespace is
# created with: npx wrangler kv namespace create STATS_CONFIG
# Local `wrangler pages dev` simulates this binding automatically (id ignored).
[[kv_namespaces]]
binding = "STATS_CONFIG"
id = "f1fa625cdb844c109c4db4acc02d00f5"

# Shared geo store written by the public gss-beacon project; read-only here.
[[d1_databases]]
binding = "gss_geo"
database_name = "gss-geo"
database_id = "fa0b2929-0086-479e-ae10-50509c34ebf8"

# gss-stats' OWN ads-read store (docs/adr/0001-ads-read-store.md): Google Ads spend, the
# readings log and threshold state, written by scripts/ads-reads/ and read by /api/metrics (the
# spend and freshness facts) and /api/ads/readings. Schema: migrations/gss-stats-ads/, applied with
#   npx wrangler d1 migrations apply gss-stats-ads --remote
# migrations_dir is scoped to this database only, so `migrations apply gss-geo` finds nothing.
[[d1_databases]]
binding = "gss_stats_ads"
database_name = "gss-stats-ads"
database_id = "785327a3-683c-4f85-819d-abe11efcacc9"
migrations_dir = "migrations/gss-stats-ads"

# The Budget section's OWN database (docs/adr/0007-budget-section.md): household bank data, kept apart
# from every other store so one mistake can't reach it and it can be restored on its own. Read and
# written only by functions/api/budget/** behind the BUDGET_ALLOWED_EMAILS list. Schema:
# migrations/gss-budget/, applied by hand once per environment:
#   npx wrangler d1 migrations apply gss-budget --remote
# migrations_dir is scoped to this database only. The id comes from `wrangler d1 create gss-budget`.
[[d1_databases]]
binding = "BUDGET_DB"
database_name = "gss-budget"
database_id = "1194bb36-100d-480e-baed-61d545e7873c"
migrations_dir = "migrations/gss-budget"

# The gss-stats-sync Worker (workers/sync/), reachable ONLY through this Service Binding: it has
# no workers.dev URL and no route. /api/ads/refresh asks it to run the shared Ads sync when the
# data is stale (docs/adr/0001-ads-read-store.md, "The sync Worker").
[[services]]
binding = "ADS_SYNC"
service = "gss-stats-sync"

# The gss-live Worker (workers/live/), reachable ONLY through this Service Binding: no workers.dev
# URL, no route. /api/live (functions/api/live.ts) hands it the dashboard's same-origin WebSocket
# upgrade; it sends the empty live-push ping. Without it (e.g. `wrangler pages dev` while gss-live
# isn't running) /api/live answers 503 and nothing else changes.
[[services]]
binding = "LIVE"
service = "gss-live"

# The gss-budget-receipts Worker (workers/receipts/), reachable ONLY through this Service Binding: no
# workers.dev URL, no route. functions/api/budget/email/* hand it the Gmail code exchange, a manual sync
# and a disconnect. Without it (or without the RECEIPTS_GMAIL_CLIENT_ID Pages secret) the email routes
# answer "not configured" and Budget works as before. The Worker must exist before a Pages deploy binds it.
[[services]]
binding = "RECEIPTS"
service = "gss-budget-receipts"

# The gss-budget-banks Worker (workers/banks/), reachable ONLY through this Service Binding: no workers.dev
# URL, no route. functions/api/budget/banks/* hand it the Plaid link token, the token exchange, unlink and the
# accounts refresh; functions/hooks/plaid.ts forwards Plaid's webhook to it (the one unauthenticated path). Without
# it (preview, or `wrangler pages dev` without the Worker) every banks route but the status read answers 503
# banks_not_configured. Top level ONLY: the preview shares the production D1, so it never gets this binding. The
# Worker must exist before a Pages deploy binds it (.github/workflows/deploy.yml deploy-banks).
[[services]]
binding = "BANKS"
service = "gss-budget-banks"

# Receipts sharing (functions/api/budget/email/links.ts): "fields" = each listed Budget person sees the
# other's receipt fields (never the Gmail link); "none" (the code default) = owner only. Mike chose
# "fields" on 2026-11-23. Not a secret.
[vars]
RECEIPTS_SHARE = "fields"

# Secrets (NOT here): RECEIPTS_GMAIL_CLIENT_ID (the Gmail OAuth client id, a Pages secret:
# `npx wrangler pages secret put RECEIPTS_GMAIL_CLIENT_ID`), BUDGET_ALLOWED_EMAILS (comma-separated; who may open /api/budget/*, set
# per environment with `npx wrangler pages secret put BUDGET_ALLOWED_EMAILS`, locally in .dev.vars;
# unset or empty locks everyone out) and CF_ANALYTICS_TOKEN — set per-environment via
#   npx wrangler pages secret put CF_ANALYTICS_TOKEN
# and locally via .dev.vars (gitignored).

# ── Preview environment (Pages preview deployments only) ─────────────────────────
# Pages uses [env.preview] for every non-production-branch deploy, e.g.
#   npx wrangler pages deploy dist --project-name gss-stats --branch dev
# which serves at https://dev.gss-stats.pages.dev. There is no [env.production], so
# production keeps using the top-level config above, unchanged. Bindings and vars are
# NOT inherited from the top level, so every binding is repeated here. See README
# "Deploy" → "Preview (dev)" and the 2026-09-30 amendment in docs/adr/0002-google-auth.md.
[env.preview]

# Preview's OWN config store (gss-stats-config-preview), seeded with a copy of the
# production dashboard; preview saves never touch production's STATS_CONFIG.
[[env.preview.kv_namespaces]]
binding = "STATS_CONFIG"
id = "7c960394bc934b07a0564e58525c1f73"

# The same real D1 stores as production: preview reads live geo and ads data.
[[env.preview.d1_databases]]
binding = "gss_geo"
database_name = "gss-geo"
database_id = "fa0b2929-0086-479e-ae10-50509c34ebf8"

[[env.preview.d1_databases]]
binding = "gss_stats_ads"
database_name = "gss-stats-ads"
database_id = "785327a3-683c-4f85-819d-abe11efcacc9"
migrations_dir = "migrations/gss-stats-ads"

# The Budget database, as above (preview and production share it; the preview's own
# BUDGET_ALLOWED_EMAILS secret decides who may open it).
[[env.preview.d1_databases]]
binding = "BUDGET_DB"
database_name = "gss-budget"
database_id = "1194bb36-100d-480e-baed-61d545e7873c"
migrations_dir = "migrations/gss-budget"

# The real sync Worker: an ads refresh on preview runs a real Google Ads sync.
[[env.preview.services]]
binding = "ADS_SYNC"
service = "gss-stats-sync"

# The gss-live Worker, as above (Pages does not inherit service bindings into [env.preview]).
[[env.preview.services]]
binding = "LIVE"
service = "gss-live"

# The gss-budget-receipts Worker, as above.
[[env.preview.services]]
binding = "RECEIPTS"
service = "gss-budget-receipts"

# NO BANKS binding here, on purpose: the preview shares the production Budget D1, and a bank link made
# from the preview would write real bank data through preview code (functions/_lib/banksBinding.ts).
# Banks routes answer 503 banks_not_configured on preview, and so does functions/hooks/plaid.ts.

# The one extra hostname the host guard (functions/_middleware.ts) serves, and only
# where this var is set: preview deployments. Production never has it.
[env.preview.vars]
PREVIEW_HOST = "dev.gss-stats.pages.dev"
RECEIPTS_SHARE = "fields"
